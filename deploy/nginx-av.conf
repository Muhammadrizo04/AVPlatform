# /etc/nginx/sites-available/av  (so'ng: ln -s ... /etc/nginx/sites-enabled/av)
# Nginx ortida .env da PROXY_ORQASIDA=True bo'lishi SHART (axes mijoz IP'sini X-Forwarded-For dan oladi).
# HTTPS (VPS): certbot --nginx -d <domen> — 80 -> 443 yo'naltirish va sertifikatni o'zi qo'shadi.
server {
    listen 80;
    server_name av.example.uz;

    client_max_body_size 16m;

    location /static/ {
        alias /opt/av/app/staticfiles/;
        expires 7d;
    }

    # /media/ ataylab ochilmaydi: rasmlarni ruxsat tekshiruvi bilan Django beradi.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
