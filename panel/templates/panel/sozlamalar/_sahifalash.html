{% if sahifa.paginator.num_pages > 1 %}
<div class="amallar justify-content-end mb-4">
  {% if sahifa.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ sahifa.previous_page_number }}">‹ Oldingi</a>{% endif %}
  <span>{{ sahifa.number }} / {{ sahifa.paginator.num_pages }}</span>
  {% if sahifa.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ sahifa.next_page_number }}">Keyingi ›</a>{% endif %}
</div>
{% endif %}
