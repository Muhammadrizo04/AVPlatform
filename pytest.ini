[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
# jonli testlar standart o'tkazib yuboriladi; ishga tushirish: pytest -m jonli -q
addopts = -p no:cacheprovider -m "not jonli"
markers =
    jonli: haqiqiy 1C (.env dagi ONEC_*) ga ulanadigan test; standart o'tkazib yuboriladi
