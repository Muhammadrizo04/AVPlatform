<li class="border rounded p-2">
  <form method="post" action="{% url 'reviziya:qayd_qosh' rv.pk %}" class="d-flex flex-wrap align-items-center gap-2">{% csrf_token %}
    <input type="hidden" name="keyingi" value="{{ keyingi }}">
    {% if qr %}<input type="hidden" name="qr" value="{{ qr }}">{% else %}<input type="hidden" name="av" value="{{ av.pk }}">{% endif %}
    <div class="me-auto" style="min-width: 14rem">
      <b>{{ av.nomi }}</b>
      <div class="small text-body-secondary">{{ av.inv_raqam|default:"inv. raqamsiz" }}{% if filial %} · <span class="text-danger-emphasis">{{ filial.nomi }} filialiniki</span>{% endif %}</div>
    </div>
    <select class="form-select form-select-sm w-auto" name="bolim" aria-label="Qaysi xonada topildi">
      <option value="">Bo'limsiz</option>
      {% for b in bolimlar %}<option value="{{ b.pk }}">{{ b.toliq_nomi }}</option>{% endfor %}
    </select>
    <input class="form-control form-control-sm" type="number" name="soni" value="1" min="0.001" step="any" style="width: 5.5rem" aria-label="Topilgan soni">
    <button type="submit" class="btn btn-sm btn-success"><i class="cil-plus me-1"></i>Topildi deb qo'shish</button>
  </form>
</li>
