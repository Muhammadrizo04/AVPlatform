{% load l10n %}<section id="qolganlar"{% if oob %} hx-swap-oob="true"{% endif %}>
  <div class="m-sarlavha-qator">
    <h2>Qolganlar <span class="m-xira">— kutilgan, lekin belgilanmagan ({{ qolganlar|length }})</span></h2>
    {% if qolganlar|length > 1 %}
    <button class="m-tugma m-kichik" type="button" hx-post="{% url 'reviziya:mobil_hammasi_bor' rv.pk %}" hx-vals='{"bolim": "{{ xona_qiymati }}"}'
            hx-target="#kartochka" hx-confirm="Ro'yxatdagi {{ qolganlar|length }} ta AV hammasi joyida deb belgilansinmi?">Hammasi joyida</button>
    {% endif %}
  </div>
  {% if qolganlar %}
  <input class="m-maydon" type="search" data-qolgan-filtr placeholder="Nomi, inv. raqam yoki javobgar shaxs" aria-label="Qolganlar ichidan nomi, inv. raqam yoki javobgar shaxs bo'yicha qidirish" autocomplete="off">
  <ul class="m-royxat" style="margin-top:.5rem">
    {% for q in qolganlar %}
    <li class="m-qolgan" data-qolgan="{{ q.av.nomi|lower }} {{ q.av.inv_raqam|lower }} {{ q.mollar|join:' '|lower }}">
      <button class="m-qator" type="button" hx-get="{% url 'reviziya:mobil_topish' rv.pk %}?av={{ q.av.pk }}&amp;bolim={{ xona_qiymati }}" hx-target="#kartochka" title="Sonini yoki holatini o'zgartirib belgilash">
        <span class="m-asosiy"><b>{{ q.av.nomi }}</b><span class="m-xira">{{ q.av.inv_raqam|default:"inv. raqamsiz" }}</span>
          <span class="m-mol">{% if q.mollar %}Javobgar: {{ q.mollar|join:", " }}{% else %}Javobgarsiz{% endif %}</span></span>
        <span class="m-son">{{ q.soni|son }}</span>
      </button>
      <button class="m-tugma m-bor" type="button" hx-post="{% url 'reviziya:mobil_saqla' rv.pk %}" hx-target="#kartochka"
              hx-vals='{"bolim": "{{ xona_qiymati }}", "av": "{{ q.av.pk }}", "soni": "{{ q.soni|unlocalize }}", "usul": "qidiruv"}'
              aria-label="{{ q.av.nomi }} — joyida ({{ q.soni|son }} dona)" title="Joyida — {{ q.soni|son }} dona">✓</button>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="m-bosh">Bu xonada kutilgan hamma AV belgilangan.</p>
  {% endif %}
</section>
