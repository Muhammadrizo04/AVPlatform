<section id="qolganlar"{% if oob %} hx-swap-oob="true"{% endif %}>
  <h2>Qolganlar <span class="m-xira">— bu xonada kutilgan, lekin hali belgilanmagan ({{ qolganlar|length }})</span></h2>
  {% if qolganlar %}
  <input class="m-maydon" type="search" data-qolgan-filtr placeholder="Ro'yxatdan qidirish" aria-label="Qolganlar ichidan qidirish" autocomplete="off">
  <ul class="m-royxat" style="margin-top:.5rem">
    {% for q in qolganlar %}
    <li data-qolgan="{{ q.av.nomi|lower }} {{ q.av.inv_raqam|lower }}">
      <button class="m-qator" type="button" hx-get="{% url 'reviziya:mobil_topish' rv.pk %}?av={{ q.av.pk }}&amp;bolim={{ xona_qiymati }}" hx-target="#kartochka">
        <span class="m-asosiy"><b>{{ q.av.nomi }}</b><span class="m-xira">{{ q.av.inv_raqam|default:"inv. raqamsiz" }}</span></span>
        <span class="m-son">{{ q.soni|son }}</span>
      </button>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="m-bosh">Bu xonada kutilgan hamma AV belgilangan.</p>
  {% endif %}
</section>
