<section id="rasmlar">
  <h2>Rasmlar</h2>
  {% if xato %}<p class="xato" role="alert">{{ xato }}</p>{% endif %}
  <div class="kartochkalar">
    {% for r in rasmlar %}
    <figure style="margin:0">
      <a href="{% url 'vositalar:rasm_fayl' r.pk %}" target="_blank" rel="noopener">
        <img src="{% url 'vositalar:rasm_fayl' r.pk %}?mini=1" alt="AV rasmi" loading="lazy" style="max-width:150px;max-height:150px">
      </a>
      <figcaption>
        {% if r.asosiy %}<strong>Asosiy</strong>
        {% elif av_tahrir %}
        <form hx-post="{% url 'vositalar:rasm_asosiy' av.pk %}" hx-target="#rasmlar" hx-swap="outerHTML">
          <input type="hidden" name="rasm" value="{{ r.pk }}"><button type="submit">Asosiy qilish</button>
        </form>
        {% endif %}
      </figcaption>
    </figure>
    {% empty %}
    <p>Rasm yo'q.</p>
    {% endfor %}
  </div>
  {% if av_tahrir %}
  <form hx-post="{% url 'vositalar:rasm_yukla' av.pk %}" hx-target="#rasmlar" hx-swap="outerHTML" hx-encoding="multipart/form-data">
    <input type="file" name="fayl" accept="image/jpeg,image/png" capture="environment" required>
    <button type="submit">Yuklash</button>
  </form>
  {% endif %}
</section>
