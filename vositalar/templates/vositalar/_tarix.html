<section id="tarix" class="card mb-4">
  <div class="card-header fw-semibold">Tarix</div>
  <div class="table-responsive"><table class="table table-sm table-hover mb-0">
    <thead><tr><th>Sana</th><th>Voqea</th><th>Kim</th></tr></thead>
    <tbody>
    {% for q in tarix %}
      <tr><td>{{ q.sana|date:"d.m.Y H:i" }}</td><td>{{ q.matn }}</td><td>{{ q.kim }}</td></tr>
    {% empty %}
      <tr><td colspan="3">Tarix bo'sh.</td></tr>
    {% endfor %}
    </tbody>
  </table></div>
</section>
