{% extends "panel/base.html" %}
{% block sarlavha %}AV ro'yxati{% endblock %}
{% block kontent %}
<h1>Asosiy vositalar</h1>

<form method="get" action="{% url 'vositalar:royxat' %}" hx-get="{% url 'vositalar:royxat' %}" hx-target="#jadval" hx-push-url="true"
      hx-trigger="change, keyup changed delay:300ms from:input[name=q]">
  <input type="search" name="q" value="{{ params.q }}" placeholder="Inv. raqam yoki nomi">
  <select name="filial"><option value="">Barcha filiallar</option>
    {% for f in filiallar %}<option value="{{ f.pk }}" {% if params.filial == f.pk|stringformat:"s" %}selected{% endif %}>{{ f.nomi }}</option>{% endfor %}
  </select>
  <select name="bolim"><option value="">Barcha bo'limlar</option>
    {% for b in bolimlar %}<option value="{{ b.pk }}" {% if params.bolim == b.pk|stringformat:"s" %}selected{% endif %}>{{ b.filial.nomi }} / {{ b.toliq_nomi }}</option>{% endfor %}
  </select>
  <select name="turi"><option value="">Barcha turlar</option>
    {% for t in turlar %}<option value="{{ t.pk }}" {% if params.turi == t.pk|stringformat:"s" %}selected{% endif %}>{{ t.nomi }}</option>{% endfor %}
  </select>
  <select name="holat"><option value="">Barcha holatlar</option>
    {% for kalit, nomi in holatlar %}<option value="{{ kalit }}" {% if params.holat == kalit %}selected{% endif %}>{{ nomi }}</option>{% endfor %}
  </select>
  <label><input type="checkbox" name="guruh" value="1" {% if params.guruh == "1" %}checked{% endif %}> Guruhlar</label>
  <label><input type="checkbox" name="arxiv" value="1" {% if params.arxiv == "1" %}checked{% endif %}> Arxiv</label>
  {% if params.bayroq %}<input type="hidden" name="bayroq" value="{{ params.bayroq }}">{% endif %}
  <noscript><button type="submit">Qidirish</button></noscript>
  <a href="{% url 'vositalar:royxat_excel' %}?{{ query }}">Excel</a>
</form>

<div id="jadval">{% include "vositalar/_jadval.html" %}</div>
{% endblock %}
